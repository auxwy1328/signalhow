<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "SignalHow",
  "url": "{{ .Site.BaseURL }}",
  "logo": "{{ .Site.BaseURL }}favicon.ico",
  "description": "{{ .Site.Params.Description }}"
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "SignalHow",
  "url": "{{ .Site.BaseURL }}",
  "description": "{{ .Site.Params.Description }}"
}
</script>

{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "SignalHow",
  "url": "{{ .Site.BaseURL }}",
  "description": "{{ .Site.Params.Description }}",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ .Site.BaseURL }}search?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
{{- end }}

{{- if and (eq .Kind "page") (not .IsHome) }}
{{- $pageType := "Article" }}
{{- if eq .Section "download" }}
  {{- $pageType = "SoftwareApplication" }}
{{- else if eq .Section "faq" }}
  {{- $pageType = "FAQPage" }}
{{- end }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ $pageType }}",
  "headline": "{{ .Title }}",
  "datePublished": "{{ .Date.Format "2006-01-02" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02" }}",
  "author": {
    "@type": "Organization",
    "name": "SignalHow 编辑部"
  },
  "publisher": {
    "@type": "Organization",
    "name": "SignalHow"
  },
  "description": "{{ .Description }}"
}
</script>
{{- end }}

{{- if not .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "首页",
      "item": "{{ .Site.BaseURL }}"
    }
    {{- if .Section }}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "{{ if eq .Section "guides" }}教程{{ else if eq .Section "compare" }}对比评测{{ else if eq .Section "safety" }}安全分析{{ else if eq .Section "download" }}下载{{ else }}{{ .Section }}{{ end }}",
      "item": "{{ .Section | absURL }}"
    }
    {{- end }}
    {{- if and (eq .Kind "page") (not .IsHome) }}
    ,{
      "@type": "ListItem",
      "position": 3,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
    {{- end }}
  ]
}
</script>
{{- end }}
