<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }} | SignalHow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
{{- $desc := .Description | default .Site.Params.Description }}
<meta name="description" content="{{ $desc }}">
<link rel="canonical" href="{{ .Permalink }}">
{{- if .IsHome }}
<link rel="canonical" href="{{ .Site.BaseURL }}">
{{- end }}

<!-- Open Graph -->
<meta property="og:title" content="{{ .Title }} | SignalHow">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:type" content="{{ cond .IsHome "website" "article" }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="SignalHow">
<meta property="og:locale" content="zh_CN">
{{- with .Site.Params.ogImage }}
<meta property="og:image" content="{{ . }}">
{{- end }}
<meta name="twitter:card" content="summary_large_image">

<!-- Favicon -->
<link rel="icon" href="/favicon.ico">

<!-- CSS -->
<style>{{ readFile "static/css/style.css" | safeCSS }}</style>
