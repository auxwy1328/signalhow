<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{- $desc := .Description | default .Site.Params.Description }}
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ $desc }}">
<meta name="keywords" content="Signal下载,Signal注册,Signal教程,Signal安全吗,Signal中文,Signal加密,端到端加密">
<link rel="canonical" href="{{ .Permalink }}">
<meta name="robots" content="{{ cond .IsHome "index, follow" "index, follow" }}">
<meta name="googlebot" content="index, follow">
<meta name="language" content="zh-CN">
<meta name="author" content="SignalHow 编辑部">
<meta name="msvalidate.01" content="58B8BC3B56964E4B68D451072143B15E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">

<!-- Open Graph -->
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:type" content="{{ cond .IsHome "website" "article" }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="SignalHow">
<meta property="og:locale" content="zh_CN">
{{- with .Site.Params.ogImage }}
<meta property="og:image" content="{{ . | absURL }}">
{{- end }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
<meta name="twitter:image" content="{{ .Site.Params.ogImage | absURL }}">
<meta name="twitter:description" content="{{ $desc }}">

<!-- Favicon -->
<link rel="icon" href="/favicon.ico">

<!-- CSS -->
<style>{{ readFile "static/css/style.css" | safeCSS }}</style>
