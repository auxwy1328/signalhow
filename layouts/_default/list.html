{{ define "main" }}

<!-- BREADCRUMB -->
<div class="breadcrumb-bar">
  <div class="breadcrumb">
    <a href="/">首页</a>
    <span class="sep">/</span>
    <span class="current">{{ .Title }}</span>
  </div>
</div>

<div class="section section-wide" style="padding-top:24px;">
  <div class="updates-header">
    <div class="updates-header-left">
      <h2>{{ .Title }}</h2>
      <span class="updates-count">{{ len .Pages }} 篇</span>
    </div>
  </div>

  <div class="updates-grid">
    {{- range .Pages }}
    <a class="update-card" href="{{ .Permalink }}">
      <div class="update-thumb">{{ with .Params.emoji }}{{ . }}{{ else }}&#128196;{{ end }}</div>
      <div class="update-content">
        <div class="update-meta">
          <span class="update-tag {{ with .Params.tagClass }}{{ . }}{{ else }}tag-update{{ end }}">{{ with .Params.category }}{{ . }}{{ else }}文章{{ end }}</span>
          <span>{{ .Date.Format "2006.01.02" }}</span>
        </div>
        <h4>{{ .Title }}</h4>
        <p>{{ .Description }}</p>
      </div>
    </a>
    {{- end }}
  </div>
</div>

{{ end }}
