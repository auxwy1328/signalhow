baseURL = 'https://signalhow.com/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'SignalHow - Signal 中文指南与安全下载'
description = 'Signal 使用教程、安全分析、多平台下载。最全面的 Signal 中文资源站，涵盖注册、设置、对比评测、常见问题解答。'
[pagination]
  pagerSize = 12
enableRobotsTXT = true
enableGitInfo = true

[sitemap]
  changefreq = 'weekly'
  priority = 0.8
  filename = 'sitemap.xml'

[minify]
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepQuotes = true
      keepEndTags = true
    [minify.tdewolff.css]
      keepQuotes = true
      precision = 0

[params]
  brand = 'SignalHow'
  tagline = 'Signal 中文指南与安全下载'
  ogImage = '/images/og-default.jpg'
  signalVersion = '7.16.0'
  author = 'SignalHow 编辑部'
  description = 'Signal 使用教程、安全分析、多平台下载。最全面的 Signal 中文资源站，涵盖注册、设置、对比评测、常见问题解答。'
  keywords = 'Signal下载,Signal教程,Signal中文,加密聊天,Signal注册,Signal安全,Signal对比'
  [params.nav]
    items = [
      { name = '下载', url = '/download/' },
      { name = '教程', url = '/guides/' },
      { name = '对比', url = '/compare/' },
      { name = '安全', url = '/safety/' },
      { name = 'FAQ', url = '/faq/' },
    ]

[taxonomies]
  tag = 'tags'
  category = 'categories'

[permalinks]
  guides = '/guides/:slug/'
  compare = '/compare/:slug/'
  safety = '/safety/:slug/'
  download = '/download/:slug/'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']

[params.indexnow]
  enabled = true
  key = "e4d99d9b3810de318ef8e1bbd764594a"
  ping = "https://api.indexnow.org/IndexNow"
